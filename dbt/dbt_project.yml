name: homa_analytics
version: 1.0.0
config-version: 2
profile: homa_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

# Paths are relative to this project directory (dbt/). Run commands from dbt/.
vars:
  raw_installs_glob: "../data/raw/installs/**/*.parquet"
  raw_levels_glob: "../data/raw/levels/**/*.parquet"

models:
  homa_analytics:
    # Default for new models; override per folder or per file with {{ config(...) }}
    +materialized: view

    staging:
      +docs:
        node_color: "#64748b"

    intermediate:
      +docs:
        node_color: "#0ea5e9"

    # Final datasets for analysts / case study answers (thin views over intermediate).
    marts:
      +docs:
        node_color: "#22c55e"
