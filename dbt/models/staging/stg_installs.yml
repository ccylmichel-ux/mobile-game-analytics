version: 2

models:
  - name: stg_installs
    description: Install events from raw Parquet (Hive partitions under data/raw/installs).
    columns:
      - name: d_event_received
        description: "date the event was received (partition key)"
        data_tests:
          - not_null
      - name: i_timestamp
        description: "unix timestamp of event reception"
      - name: s_user_id
        description: "user id"
        data_tests:
          - not_null
      - name: s_country_code
        description: "s_country_code (string) — country the event was triggered from"
      - name: s_event_client_timestamp
        description: "client-side event timestamp (UTC)"
      - name: s_event_name
        description: "name of the event"
        data_tests:
          - not_null
      - name: s_event_value
        description: "payload (may contain level id and other event specific attributes)"

